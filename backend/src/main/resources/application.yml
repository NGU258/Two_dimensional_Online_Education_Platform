# 数据库连接配置
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/education_platform?useSSL=false&serverTimezone=UTC
    username: root
    password: lyq20041230
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    bucket-name: fairycat-lyq
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    domain: https://fairycat-lyq.oss-cn-shenzhen.aliyuncs.com
    policy:
      expire: 300
    maxSize: 10
    dir:
      prefix: education/

# Knife4j 配置
